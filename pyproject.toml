[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soltrace"
version = "0.3.0"
description = "Universal Cryptographic Ledger & Provenance Engine on Solana"
readme = "README.md"
authors = [
    { name = "Oladeji Sanyaolu", email = "oladejisanyaolu@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "solana>=0.34.0",
    "solders>=0.21.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
soltrace = "soltrace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soltrace*"]
