<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" fill="none">

  <defs>
    <linearGradient id="soltrace-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="mark-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
    .brand-title {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .brand-badge-txt {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .brand-tagline {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: -0.015em;
    }
    .mono-txt {
      font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace;
      font-size: 11px;
    }
  </style>

  <rect width="480" height="280" rx="16" fill="#09090b"/>
  <rect width="480" height="280" rx="16" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Centered mark: 72x72 at x=204, y=36 -->
  <g transform="translate(204, 36) scale(2.25)" filter="url(#mark-shadow)">
    <rect width="32" height="32" rx="8" fill="url(#soltrace-gradient)"/>
    <path d="M16 7l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V10z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M12.5 16l2.5 2.5 4.5-4.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="240" y="160" class="brand-title" font-size="44" fill="#fafafa" text-anchor="middle">SolTrace</text>

  <!-- Tagline -->
  <text x="240" y="196" class="brand-tagline" font-size="16" fill="#a1a1aa" text-anchor="middle">Tamper-Proof Business Records on Solana</text>

  <!-- Badge pill below tagline -->
  <g transform="translate(120, 222)">
    <rect width="240" height="28" rx="14" fill="#141418" stroke="#27272a" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#14F195"/>
    <text x="28" y="18.5" class="brand-badge-txt" font-size="11.5" fill="#71717a">UNIVERSAL CRYPTOGRAPHIC LEDGER</text>
  </g>
</svg>