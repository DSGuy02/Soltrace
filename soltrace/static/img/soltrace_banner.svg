<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">

  <defs>
    <linearGradient id="soltrace-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="mark-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
    .brand-title {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .brand-badge-txt {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .brand-tagline {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: -0.015em;
    }
    .mono-txt {
      font-family: 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace;
      font-size: 11px;
    }
  </style>

  <defs>
    <radialGradient id="solana-glow-bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#9945FF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#14F195" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark zinc background -->
  <rect width="1280" height="640" fill="#09090b"/>
  <!-- Ambient Solana radial aura -->
  <rect width="1280" height="640" fill="url(#solana-glow-bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08">
    <path d="M0 80h1280 M0 160h1280 M0 240h1280 M0 320h1280 M0 400h1280 M0 480h1280 M0 560h1280" stroke="#fafafa" stroke-width="1"/>
    <path d="M160 0v640 M320 0v640 M480 0v640 M640 0v640 M800 0v640 M960 0v640 M1120 0v640" stroke="#fafafa" stroke-width="1"/>
  </g>

  <!-- Top Pill: Colosseum World's Fair 2026 -->
  <g transform="translate(485, 90)">
    <rect width="310" height="32" rx="16" fill="#141418" stroke="#27272a" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#14F195"/>
    <text x="30" y="21" class="brand-badge-txt" font-size="12" fill="#d4d4d8">Colosseum Crypto World's Fair 2026</text>
  </g>

  <!-- Centered Icon (100x100) at x=590, y=148 -->
  <g transform="translate(590, 148) scale(3.125)" filter="url(#mark-shadow)">
    <rect width="32" height="32" rx="8" fill="url(#soltrace-gradient)"/>
    <path d="M16 7l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V10z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M12.5 16l2.5 2.5 4.5-4.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Wordmark -->
  <text x="640" y="325" class="brand-title" font-size="76" fill="#fafafa" text-anchor="middle">SolTrace</text>

  <!-- Core Headline Tagline -->
  <text x="640" y="380" class="brand-tagline" font-size="26" fill="#e4e4e7" text-anchor="middle">Tamper-Proof Business Records on Solana</text>

  <!-- Subtitle -->
  <text x="640" y="420" class="brand-tagline" font-size="17" fill="#a1a1aa" text-anchor="middle">Instant cryptographic proof for B2B invoices, inventory counts &amp; customer orders</text>

  <!-- 3 Feature Chips Below -->
  <g transform="translate(365, 475)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="165" height="36" rx="18" fill="#141418" stroke="#27272a" stroke-width="1"/>
    <text x="82.5" y="23" class="brand-badge-txt" font-size="13" fill="#fafafa" text-anchor="middle">&lt; 400ms Finality</text>

    <!-- Chip 2 -->
    <rect x="180" y="0" width="185" height="36" rx="18" fill="#141418" stroke="#27272a" stroke-width="1"/>
    <text x="272.5" y="23" class="brand-badge-txt" font-size="13" fill="#14F195" text-anchor="middle">$0.00025 per Seal</text>

    <!-- Chip 3 -->
    <rect x="380" y="0" width="170" height="36" rx="18" fill="#141418" stroke="#27272a" stroke-width="1"/>
    <text x="465" y="23" class="brand-badge-txt" font-size="13" fill="#fafafa" text-anchor="middle">Zero Smart Contracts</text>
  </g>

  <!-- Bottom subtle border -->
  <line x1="0" y1="639" x2="1280" y2="639" stroke="#27272a" stroke-width="1"/>
</svg>